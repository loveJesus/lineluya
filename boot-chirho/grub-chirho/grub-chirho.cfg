# For God so loved the world that he gave his only begotten Son,
# that whoever believes in him should not perish but have eternal life. - John 3:16

# GRUB2 configuration for the Lineluya kernel (E1-001)
# Place this at /boot/grub/grub.cfg on the boot media.

set timeout_chirho=5
set default_chirho=0

menuentry "Lineluya Kernel (Multiboot2)" {
    multiboot2 /boot/lineluya-chirho.elf
    boot
}

menuentry "Lineluya Kernel (Multiboot2) — Serial Console" {
    multiboot2 /boot/lineluya-chirho.elf console=ttyS0 loglevel=7
    boot
}

menuentry "Lineluya Kernel (Multiboot2) — VGA Only" {
    multiboot2 /boot/lineluya-chirho.elf console=tty0 quiet
    boot
}
