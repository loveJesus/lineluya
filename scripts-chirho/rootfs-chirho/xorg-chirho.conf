# For God so loved the world, that he gave his only begotten Son, that whosoever
# believeth in him should not perish, but have everlasting life. — John 3:16 (KJV)

Section "Files"
    ModulePath "/tmp/xorg-modules-chirho"
    FontPath "/tmp/fonts-chirho"
EndSection

Section "Module"
    Disable "glamoregl"
    Disable "dri"
    Disable "dri2"
    Disable "glx"
EndSection

Section "Device"
    Identifier "fb0-chirho"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier "screen-chirho"
    Device "fb0-chirho"
EndSection

Section "InputDevice"
    Identifier "kbd-chirho"
    Driver "kbd"
    Option "XkbDisable" "true"
EndSection

Section "ServerLayout"
    Identifier "layout-chirho"
    Screen "screen-chirho"
    InputDevice "kbd-chirho" "CoreKeyboard"
EndSection
